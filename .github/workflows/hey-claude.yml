name: Build Hey Claude

on:
  push:
    branches: [main, hey-claude]
    paths:
      - 'hey-claude/**'
      - '.github/workflows/hey-claude.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch the offline speech model
        run: |
          curl -fL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p hey-claude/app/src/main/assets
          mv vosk-model-small-en-us-0.15 hey-claude/app/src/main/assets/model-en-us
          uuidgen > hey-claude/app/src/main/assets/model-en-us/uuid

      - name: Build the app
        working-directory: hey-claude
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish the install file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp hey-claude/app/build/outputs/apk/debug/app-debug.apk hey-claude.apk
          gh release delete hey-claude-latest --yes --cleanup-tag || true
          gh release create hey-claude-latest hey-claude.apk \
            --target "${{ github.sha }}" \
            --title "Hey Claude (latest build)" \
            --notes "Install file for the Hey Claude wake phrase app. See hey-claude/README.md."
